<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<div class="div1">
    <h2>Iniciar sessão</h2>

    <form>
        <input
            type="email"
            placeholder="Digite o seu e-mail"
        >

        <input
            type="password"
            placeholder="Digite a sua senha"
        >

        <button type="submit">Entrar</button>
    </form>

    <p>Não tens conta? <a href="#">Registar</a></p>
</div>
<div class="div2">

</div>
<style>
    *{
    padding: 0%; 
    margin: 0%;
    box-sizing: border-box;     
}
body{
    display: flex;
    justify-content: space-between;
    color: black;
    width: 100%;
    height: 100vh;
}
#div1{
    display: flex;
    align-items: center;
    display: block;
    

}
#div2{
    background-color: rgb(251, 255, 0);
    width: 50%;
    height: 100vh;
}
button{
    background-color: black;
    color: white;

}
input{
    display: block;
}
</style>
</body>
</html>
