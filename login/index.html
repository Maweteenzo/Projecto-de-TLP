<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    
<div class="login">
    <h2>Iniciar sessão</h2>

    <form>
        <input
            type="email"
            placeholder="Digite o seu e-mail"
            required
        >

        <input
            type="password"
            placeholder="Digite a sua senha"
            required
        >

        <button type="submit">Entrar</button>
    </form>

    <p>Não tens conta? <a href="#">Registar</a></p>
</div>

</body>
</html>
