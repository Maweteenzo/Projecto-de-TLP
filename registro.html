<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta</title>
    <link rel="stylesheet" href="css/2style.css">
</head>
<body>
    <div id="div1"></div>
    <div id="div2">
        <img src="img/logo-escola.jpg" alt="Logótipo do IPDDF" class="logo">
        <h2>Criar conta</h2>
        <form action="news.html">
            <input type="text" placeholder="Digite o seu nome" required>
            <input type="email" placeholder="Digite o seu e-mail" required>
            <input type="password" placeholder="Digite a sua senha" required>
            <input type="password" placeholder="Confirme a sua senha" required>
            <button type="submit">Registrar</button>
        </form>
        <p>Já tens conta? <a href="index.html">Iniciar sessão</a></p>
    </div>
</body>
</html>
